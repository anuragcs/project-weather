version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: wind-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=https://api.bmreports.com/BMRS
      - ELEXON_API_KEY=
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: wind-frontend
    depends_on:
      - backend
    ports:
      - "4173:4173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
